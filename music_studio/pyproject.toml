[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "penny-music-studio"
version = "0.1.0"
description = "CPU-first procedural composition extension for Penny AI"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
susan = ["torch>=2.5"]

[project.scripts]
penny-music = "penny_music_studio.cli:main"

[tool.setuptools.packages.find]
include = ["penny_music_studio*"]

[project.optional-dependencies]
susan = ["torch>=2.4,<3"]
